# Foundry config for the ShotAnte contracts. Build output goes to forge-out/
# (the deploy pipeline reads the slim {abi, bytecode} artifact that
# scripts/compile-contract.mjs extracts into contracts/out/MatchEscrow.json).
[profile.default]
src = "src"
test = "test"
libs = ["lib"]
out = "forge-out"
cache_path = "forge-cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200   # matches the original solc-js settings (same bytecode)
verbosity = 2

[fuzz]
runs = 512
