[package]
name = "zz-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZombieZap first-person client: Bevy, native for dev and wasm32 for the browser."

[dependencies]
# zz-core re-enters with netcode (protocol / map / sim). Skeleton is Bevy-only.
bevy = { workspace = true, features = [
    # --- app core (default_app pieces, no scene/audio) ---
    # multi_threaded is native-only (see target block below) — wasm is single-
    # threaded and the feature only bloats the ship bundle.
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    # No reflect_auto_register: we don't drive scenes from reflection; skipping
    # the auto type registry is free size on wasm.

    # --- windowing / platform ---
    # x11/wayland are native-only (see target block).
    "bevy_window",
    "bevy_winit",
    "webgl2",
    "default_font",

    # --- render + pbr (no gltf / animation / audio) ---
    # LUT-free tonemap (SomewhatBoringDisplayTransform on the 3D camera) so we
    # can drop tonemapping_luts + ktx2 + zstd_rust (largest wasm win).
    # No png: all textures are procedural; default_font is a TTF subset.
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_material",
    "bevy_image",
    "bevy_shader",
    "bevy_color",

    # --- ui + text ---
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",

    # --- audio (procedural SFX via Decodable; no file-format features) ---
    "bevy_audio",
] }

# netcode: poll-based WebSocket, one API for native + wasm
[dependencies.ewebsock]
workspace = true

[dependencies.zz-core]
workspace = true

[dependencies.serde_json]
workspace = true

# Slim bevy_egui: keep render + fonts for the lobby, drop clipboard/picking
# (we never copy invite URLs via arboard; pointer goes through egui's own
# input, not bevy_picking). Saves arboard + mesh_picking graph on wasm.
[dependencies.bevy_egui]
workspace = true
default-features = false
features = [
    "default_fonts",
    "render",
    "bevy_ui",
    "open_url",
]

# Desktop-only: Bevy multi_threaded + window backends, plus mic capture.
# (Bevy features merge with the shared list above for non-wasm targets.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = [
    "multi_threaded",
    "x11",
    "wayland",
] }
cpal = "0.15"

# Browser platform seam: same-origin WS URL, ?join= prefill, localStorage name,
# touch detection (Navigator.maxTouchPoints), soft-keyboard HTML overlays,
# proximity-voice JS bridge (getUserMedia / AudioWorklet live in index.html).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Navigator",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "DomTokenList",
    "CssStyleDeclaration",
] }
