<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZOMBIEZAP</title>
    <meta
      name="description"
      content="free co-op zombie survival in your browser"
    />

    <!-- Open Graph / social unfurl (absolute URLs for crawlers) -->
    <meta property="og:title" content="ZOMBIEZAP" />
    <meta
      property="og:description"
      content="free co-op zombie survival in your browser"
    />
    <meta property="og:image" content="https://zombiezap.com/og.jpg" />
    <meta property="og:url" content="https://zombiezap.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X large card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZOMBIEZAP" />
    <meta
      name="twitter:description"
      content="free co-op zombie survival in your browser"
    />
    <meta name="twitter:image" content="https://zombiezap.com/og.jpg" />

    <!-- Favicons (stable names at site root) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Trunk copy-file: ships share assets to dist/ at the site root with
      exact filenames (no content hashing). The directive <link> itself is
      removed from the built HTML. See Trunk guide → Assets → copy-file.
    -->
    <link data-trunk rel="copy-file" href="og.jpg" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="favicon-16.png" />
    <link data-trunk rel="copy-file" href="favicon-32.png" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />

    <link data-trunk rel="css" href="styles.css" />
    <!--
      Release: Trunk.toml cargo_profile = "wasm-release" on --release.
      data-wasm-opt="z" → binaryen -Oz. Rust ≥1.82 emits bulk-memory /
      nontrapping-fptoint; wasm-opt needs those features enabled.
      Use data-wasm-opt="0" for faster local iteration without binaryen.
    -->
    <link
      data-trunk
      rel="rust"
      href="../crates/zz-client/Cargo.toml"
      data-bin="zz-client"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"
    />
  </head>
  <body>
    <!--
      Shown until the wasm module finishes init. Trunk's generated module
      script runs after this markup; we hide #zz-loading once the Bevy canvas
      is sized (WebGL ready). No external fonts/CDNs.
    -->
    <div id="zz-loading" aria-live="polite" aria-busy="true">
      <div class="zz-loading-card">
        <div class="zz-loading-title">ZOMBIEZAP</div>
        <div class="zz-loading-sub">loading…</div>
        <div class="zz-loading-bar" aria-hidden="true">
          <div class="zz-loading-bar-fill"></div>
        </div>
      </div>
    </div>
    <canvas id="zz-canvas"></canvas>

    <!--
      Soft-keyboard bridge (touch devices / ?touch=1): egui TextEdit does not
      summon mobile keyboards. Shown only while the menu is up (platform.rs
      toggles display). Values are polled into LobbyView / join draft.
    -->
    <div id="zz-touch-fields" style="display: none" aria-hidden="true">
      <label class="zz-touch-label" for="zz-name-input">CALLSIGN</label>
      <input
        id="zz-name-input"
        type="text"
        name="zz-name"
        autocomplete="nickname"
        maxlength="24"
        placeholder="survivor"
        enterkeyhint="done"
        autocapitalize="off"
        spellcheck="false"
        style="display: none"
      />
      <label class="zz-touch-label" for="zz-code-input">LOBBY CODE</label>
      <input
        id="zz-code-input"
        type="text"
        name="zz-code"
        autocomplete="off"
        maxlength="5"
        placeholder="XXXXX"
        enterkeyhint="go"
        autocapitalize="characters"
        spellcheck="false"
        inputmode="text"
        style="display: none"
      />
    </div>

    <!-- Portrait orientation: ask for landscape (touch CSS shows this). -->
    <div id="zz-landscape-hint" aria-live="polite">
      <div class="zz-landscape-card">
        <div class="zz-landscape-icon" aria-hidden="true">↻</div>
        <div>rotate your phone</div>
        <div class="zz-landscape-sub">landscape works best</div>
      </div>
    </div>

    <!-- ODbL attribution for the Rome EUR OSM-baked map (visible on menu). -->
    <footer id="zz-map-attrib">
      Map data © OpenStreetMap contributors (ODbL) — Rome EUR
    </footer>

    <script>
      (function () {
        var loader = document.getElementById("zz-loading");
        var canvas = document.getElementById("zz-canvas");
        if (!loader || !canvas) return;
        function hide() {
          loader.classList.add("zz-hidden");
          loader.setAttribute("aria-busy", "false");
        }
        // Bevy sets canvas width/height when the WebGL surface is ready.
        var n = 0;
        var id = setInterval(function () {
          n += 1;
          if (canvas.width > 0 && canvas.height > 0) {
            clearInterval(id);
            hide();
          } else if (n > 300) {
            // ~30s safety so a failed init does not spin forever
            clearInterval(id);
            hide();
          }
        }, 100);
      })();

      // Audio unlock for browser autoplay policy. Bevy/rodio AudioContexts
      // start suspended until a user gesture; resume any we can find, and
      // expose __zzUnlockAudio for the wasm client to call as a second path.
      (function () {
        var unlocked = false;
        function unlock() {
          if (unlocked) return;
          unlocked = true;
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              // Resume any live contexts hanging off the page / rodio.
              var contexts = window.__zzAudioContexts || [];
              for (var i = 0; i < contexts.length; i++) {
                try {
                  if (contexts[i] && contexts[i].state === "suspended") {
                    contexts[i].resume();
                  }
                } catch (e) {}
              }
              // Also poke a throwaway context in-gesture (helps some browsers).
              try {
                var c = new AC();
                if (c.state === "suspended") c.resume();
                // Keep a reference so later Bevy sinks may share the gesture unlock.
                if (!window.__zzAudioContexts) window.__zzAudioContexts = [];
                window.__zzAudioContexts.push(c);
              } catch (e) {}
            }
          } catch (e) {}
        }
        window.__zzUnlockAudio = unlock;
        ["pointerdown", "touchend", "click", "keydown"].forEach(function (evt) {
          window.addEventListener(evt, unlock, { once: true, capture: true });
        });
      })();

      // Proximity voice capture bridge (wasm client polls drainFrames).
      // Mic permission is requested ONLY via requestMic() — never at startup.
      // Worklet is inlined (zero asset files); adapted from legacy
      // voice-capture-worklet.js + Voice.ts resample/frame pipeline.
      (function () {
        var SAMPLE_RATE = 16000;
        var FRAME_MS = 120;
        var FRAME_SAMPLES = Math.round((SAMPLE_RATE * FRAME_MS) / 1000); // 1920
        var MAX_QUEUED = 8;

        // Inline AudioWorklet: batch mono float samples off the main thread.
        var WORKLET_SRC =
          "class VoiceCaptureProcessor extends AudioWorkletProcessor{" +
          "constructor(){super();this.buf=new Float32Array(2048);this.n=0;}" +
          "process(inputs){var ch=inputs[0]&&inputs[0][0];if(ch){for(var i=0;i<ch.length;i++){" +
          "this.buf[this.n++]=ch[i];if(this.n===this.buf.length){this.port.postMessage(this.buf.slice(0));this.n=0;}}}" +
          "return true;}}registerProcessor('voice-capture',VoiceCaptureProcessor);";

        var state = {
          ready: false,
          denied: false,
          txEnabled: false,
          ctx: null,
          stream: null,
          micTrack: null,
          source: null,
          capNode: null,
          silentSink: null,
          inRate: 48000,
          cursor: 0,
          prevSample: 0,
          outAccum: new Float32Array(FRAME_SAMPLES * 4),
          outLen: 0,
          frames: [],
        };

        function ensureContext() {
          if (state.ctx) {
            if (state.ctx.state === "suspended") state.ctx.resume();
            return state.ctx;
          }
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          state.ctx = new AC();
          state.inRate = state.ctx.sampleRate || 48000;
          state.silentSink = state.ctx.createGain();
          state.silentSink.gain.value = 0;
          state.silentSink.connect(state.ctx.destination);
          if (!window.__zzAudioContexts) window.__zzAudioContexts = [];
          window.__zzAudioContexts.push(state.ctx);
          if (state.ctx.state === "suspended") state.ctx.resume();
          return state.ctx;
        }

        function resample(input) {
          var len = input.length;
          if (len === 0) return input;
          if (state.inRate === SAMPLE_RATE) {
            state.prevSample = input[len - 1];
            return input;
          }
          var ratio = state.inRate / SAMPLE_RATE;
          var out = [];
          var pos = state.cursor;
          while (pos < len) {
            var i = Math.floor(pos);
            var frac = pos - i;
            var a = i < 0 ? state.prevSample : input[i];
            var j = i + 1;
            var b = j < 0 ? state.prevSample : j < len ? input[j] : input[len - 1];
            out.push(a + (b - a) * frac);
            pos += ratio;
          }
          state.cursor = pos - len;
          state.prevSample = input[len - 1];
          return Float32Array.from(out);
        }

        function append(s) {
          var need = state.outLen + s.length;
          if (need > state.outAccum.length) {
            var grow = new Float32Array(Math.max(need, state.outAccum.length * 2));
            grow.set(state.outAccum.subarray(0, state.outLen));
            state.outAccum = grow;
          }
          state.outAccum.set(s, state.outLen);
          state.outLen += s.length;
        }

        function onCaptureChunk(input) {
          if (!state.txEnabled) {
            state.outLen = 0;
            return;
          }
          var res = resample(input);
          append(res);
          while (state.outLen >= FRAME_SAMPLES) {
            var pcm = new Int16Array(FRAME_SAMPLES);
            for (var i = 0; i < FRAME_SAMPLES; i++) {
              var s = Math.max(-1, Math.min(1, state.outAccum[i]));
              pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            // Store as Uint8Array (LE view of the Int16 buffer) for Rust.
            var u8 = new Uint8Array(pcm.buffer.slice(0));
            state.frames.push(u8);
            while (state.frames.length > MAX_QUEUED) state.frames.shift();
            state.outAccum.copyWithin(0, FRAME_SAMPLES, state.outLen);
            state.outLen -= FRAME_SAMPLES;
          }
        }

        async function buildCapture() {
          if (!state.ctx || !state.stream || state.capNode) return;
          state.source = state.ctx.createMediaStreamSource(state.stream);
          if (state.ctx.audioWorklet) {
            try {
              var blob = new Blob([WORKLET_SRC], { type: "application/javascript" });
              var url = URL.createObjectURL(blob);
              await state.ctx.audioWorklet.addModule(url);
              URL.revokeObjectURL(url);
              var node = new AudioWorkletNode(state.ctx, "voice-capture");
              node.port.onmessage = function (e) {
                onCaptureChunk(e.data);
              };
              state.source.connect(node);
              node.connect(state.silentSink);
              state.capNode = node;
              return;
            } catch (e) {
              /* fall through */
            }
          }
          // ScriptProcessor fallback (deprecated, widely available).
          var sp = state.ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = function (e) {
            onCaptureChunk(e.inputBuffer.getChannelData(0));
          };
          state.source.connect(sp);
          sp.connect(state.silentSink);
          state.capNode = sp;
        }

        async function requestMic() {
          if (state.ready || state.denied) return state.ready;
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              state.denied = true;
              return false;
            }
            ensureContext();
            if (!state.ctx) {
              state.denied = true;
              return false;
            }
            var stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
              },
              video: false,
            });
            state.stream = stream;
            state.micTrack = stream.getAudioTracks()[0] || null;
            if (state.micTrack) state.micTrack.enabled = !!state.txEnabled;
            await buildCapture();
            state.ready = true;
            return true;
          } catch (e) {
            state.denied = true;
            state.ready = false;
            return false;
          }
        }

        function setTxEnabled(on) {
          state.txEnabled = !!on;
          if (state.micTrack) state.micTrack.enabled = state.txEnabled;
          if (!state.txEnabled) {
            state.outLen = 0;
            state.frames = [];
          }
        }

        function drainFrames() {
          var out = state.frames;
          state.frames = [];
          return out;
        }

        window.__zzVoice = {
          get ready() {
            return state.ready;
          },
          get denied() {
            return state.denied;
          },
          requestMic: requestMic,
          setTxEnabled: setTxEnabled,
          drainFrames: drainFrames,
        };
      })();
    </script>
  </body>
</html>
