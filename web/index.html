<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZOMBIEZAP</title>
    <meta
      name="description"
      content="free co-op zombie survival in your browser"
    />

    <!-- Open Graph / social unfurl (absolute URLs for crawlers) -->
    <meta property="og:title" content="ZOMBIEZAP" />
    <meta
      property="og:description"
      content="free co-op zombie survival in your browser"
    />
    <meta property="og:image" content="https://zombiezap.com/og.jpg" />
    <meta property="og:url" content="https://zombiezap.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X large card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZOMBIEZAP" />
    <meta
      name="twitter:description"
      content="free co-op zombie survival in your browser"
    />
    <meta name="twitter:image" content="https://zombiezap.com/og.jpg" />

    <!-- Favicons (stable names at site root) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Trunk copy-file: ships share assets to dist/ at the site root with
      exact filenames (no content hashing). The directive <link> itself is
      removed from the built HTML. See Trunk guide → Assets → copy-file.
    -->
    <link data-trunk rel="copy-file" href="og.jpg" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="favicon-16.png" />
    <link data-trunk rel="copy-file" href="favicon-32.png" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />

    <link data-trunk rel="css" href="styles.css" />
    <!--
      Release: Trunk.toml cargo_profile = "wasm-release" on --release.
      data-wasm-opt="z" → binaryen -Oz. Rust ≥1.82 emits bulk-memory /
      nontrapping-fptoint; wasm-opt needs those features enabled.
      --strip-debug / --strip-producers: drop residual name/producers sections
      after rustc strip (small but free). Use data-wasm-opt="0" for faster
      local iteration without binaryen.
      data-initializer: M19 boot telemetry around fetch / init / run.
    -->
    <link
      data-trunk
      rel="rust"
      href="../crates/zz-client/Cargo.toml"
      data-bin="zz-client"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --strip-debug --strip-producers"
      data-initializer="boot-init.mjs"
    />
  </head>
  <body>
    <!--
      M19 HTML-first start screen: interactive immediately (type name / code /
      queue HOST|JOIN) while the wasm + Bevy engine boots behind it. Fades out
      after Rust signals engine-ready and applies the handoff.
    -->
    <div id="zz-start" aria-live="polite" aria-busy="true">
      <div class="zz-start-card">
        <div class="zz-boot-chrome">
          <div class="zz-start-title">Z O M B I E Z A P</div>
          <div class="zz-start-status" id="zz-loading-sub">loading wasm…</div>
          <div class="zz-loading-bar" aria-hidden="true">
            <div class="zz-loading-bar-fill" id="zz-loading-bar-fill"></div>
          </div>
        </div>

        <!--
          Soft-keyboard bridge (touch + desktop start): same inputs as the
          pre-M19 touch overlay. Inputs stay outside .zz-boot-chrome so touch
          handoff can hide HOST/JOIN chrome while keeping CALLSIGN/CODE.
          platform.rs toggles display after handoff.
        -->
        <div id="zz-touch-fields" style="display: flex" aria-hidden="false">
          <label class="zz-start-label zz-touch-label" for="zz-name-input"
            >CALLSIGN</label
          >
          <input
            id="zz-name-input"
            type="text"
            name="zz-name"
            autocomplete="nickname"
            maxlength="24"
            placeholder="survivor"
            enterkeyhint="done"
            autocapitalize="off"
            spellcheck="false"
            style="display: block"
          />
          <label class="zz-start-label zz-touch-label" for="zz-code-input"
            >LOBBY CODE</label
          >
          <input
            id="zz-code-input"
            type="text"
            name="zz-code"
            autocomplete="off"
            maxlength="5"
            placeholder="XXXXX"
            enterkeyhint="go"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
            style="display: block"
          />
        </div>

        <div class="zz-boot-chrome">
          <button type="button" class="zz-start-btn" id="zz-host-btn">
            [ HOST A GAME ]
          </button>
          <div class="zz-start-or">— or join a friend —</div>
          <button type="button" class="zz-start-btn" id="zz-join-btn">
            [ JOIN ]
          </button>
          <div class="zz-start-hint" id="zz-loading-hint">
            type while the engine starts
          </div>
        </div>
      </div>
    </div>
    <canvas id="zz-canvas"></canvas>

    <!-- Portrait orientation: ask for landscape (touch CSS shows this). -->
    <div id="zz-landscape-hint" aria-live="polite">
      <div class="zz-landscape-card">
        <div class="zz-landscape-icon" aria-hidden="true">↻</div>
        <div>rotate your phone</div>
        <div class="zz-landscape-sub">landscape works best</div>
      </div>
    </div>

    <!-- ODbL attribution for the Rome EUR OSM-baked map (visible on menu). -->
    <footer id="zz-map-attrib">
      Map data © OpenStreetMap contributors (ODbL) — Rome EUR
    </footer>

    <script>
      (function () {
        // ── M19 boot bridge: HTML menu + honest phase telemetry ──────────
        var pageAt = performance.now();
        performance.mark("zz-page");

        var boot = {
          pageAt: pageAt,
          marks: { page: pageAt },
          phases: {},
          pendingAction: null, // { kind: 'host' } | { kind: 'join', code: string }
          actionTaken: false,
          engineReady: false,
          handedOff: false,
          touchMode: false,
        };
        window.__zzBoot = boot;

        function mark(name) {
          var t = performance.now();
          boot.marks[name] = t;
          try {
            performance.mark("zz-" + name);
          } catch (e) {}
          return t;
        }

        function setStatus(text) {
          var sub = document.getElementById("zz-loading-sub");
          if (sub) sub.textContent = text;
        }

        function setHint(text) {
          var hint = document.getElementById("zz-loading-hint");
          if (hint) hint.textContent = text;
        }

        function setProgress(pct, solid) {
          var fill = document.getElementById("zz-loading-bar-fill");
          if (!fill) return;
          fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
          if (solid) {
            fill.classList.add("zz-solid");
            fill.style.animation = "none";
          }
        }

        function normalizeCode(raw) {
          return String(raw || "")
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 5);
        }

        function nameInput() {
          return document.getElementById("zz-name-input");
        }
        function codeInput() {
          return document.getElementById("zz-code-input");
        }

        // Prefill callsign from localStorage; lobby code from ?join=
        (function prefill() {
          try {
            var n = localStorage.getItem("zz_name");
            if (n && n.trim()) {
              var ni = nameInput();
              if (ni) ni.value = n.trim();
            }
          } catch (e) {}
          try {
            var q = (window.location.search || "").replace(/^\?/, "");
            q.split("&").forEach(function (pair) {
              var parts = pair.split("=");
              if (parts[0] === "join" && parts[1]) {
                var code = normalizeCode(decodeURIComponent(parts[1]));
                var ci = codeInput();
                if (ci) ci.value = code;
              }
            });
          } catch (e) {}
        })();

        function queueHost() {
          boot.pendingAction = { kind: "host" };
          boot.actionTaken = false;
          setHint("host queued — waiting for engine…");
          setStatus("queued host");
        }
        function queueJoin() {
          var code = normalizeCode(codeInput() && codeInput().value);
          if (!code) {
            setHint("enter a lobby code");
            return;
          }
          if (codeInput()) codeInput().value = code;
          boot.pendingAction = { kind: "join", code: code };
          boot.actionTaken = false;
          setHint("join queued — waiting for engine…");
          setStatus("queued join " + code);
        }

        var hostBtn = document.getElementById("zz-host-btn");
        var joinBtn = document.getElementById("zz-join-btn");
        if (hostBtn) hostBtn.addEventListener("click", queueHost);
        if (joinBtn) joinBtn.addEventListener("click", queueJoin);
        // Enter in code field → join
        var ci = codeInput();
        if (ci) {
          ci.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              queueJoin();
            }
          });
        }

        // Trunk initializer (boot-init.mjs) + Rust call these.
        boot.mark = mark;
        boot.setStatus = setStatus;
        boot.setHint = setHint;
        boot.setProgress = setProgress;
        boot.getName = function () {
          var el = nameInput();
          return el ? el.value : "";
        };
        boot.getCode = function () {
          var el = codeInput();
          return el ? normalizeCode(el.value) : "";
        };
        /** Peek pending action without consuming (Rust copies into HtmlBoot). */
        boot.peekAction = function () {
          return boot.pendingAction;
        };
        /** Consume pending action once (handoff). */
        boot.takeAction = function () {
          if (boot.actionTaken) return null;
          var a = boot.pendingAction;
          boot.pendingAction = null;
          boot.actionTaken = true;
          return a;
        };
        boot.setEngineReady = function () {
          boot.engineReady = true;
          mark("engine_ready");
          setStatus("engine ready");
          setProgress(100, true);
          setHint("handing off…");
          var start = document.getElementById("zz-start");
          if (start) start.setAttribute("aria-busy", "false");
        };
        /**
         * Fade the full-screen start chrome. Touch mode keeps fields as a
         * soft-keyboard overlay (class zz-post-handoff-touch); desktop hides all.
         */
        boot.handoff = function (isTouch) {
          if (boot.handedOff) return;
          boot.handedOff = true;
          boot.touchMode = !!isTouch;
          mark("handoff");
          var start = document.getElementById("zz-start");
          if (!start) return;
          if (isTouch) {
            start.classList.add("zz-post-handoff-touch");
            // Hide host/join chrome; fields stay for soft keyboard.
            var chromes = start.querySelectorAll(".zz-boot-chrome");
            for (var i = 0; i < chromes.length; i++) {
              chromes[i].style.display = "none";
            }
            // Code row had JOIN button inside boot-chrome; ensure code input
            // still displays as a full-width field.
            var code = codeInput();
            if (code) {
              code.style.display = "block";
              code.style.width = "100%";
            }
            setStatus("");
          } else {
            start.classList.add("zz-hidden");
          }
          // One-line phase summary for load regressions.
          boot.logPhases();
        };
        boot.hideAll = function () {
          var start = document.getElementById("zz-start");
          if (start) start.classList.add("zz-hidden");
          var fields = document.getElementById("zz-touch-fields");
          if (fields) fields.style.display = "none";
          var ni = nameInput();
          var ci2 = codeInput();
          if (ni) ni.style.display = "none";
          if (ci2) ci2.style.display = "none";
        };
        boot.logPhases = function () {
          var m = boot.marks;
          var p = boot.phases;
          function ms(a, b) {
            if (m[a] == null || m[b] == null) return -1;
            return Math.round(m[b] - m[a]);
          }
          // Prefer explicit phase deltas recorded by initializer / Rust.
          var fetchMs = p.fetch_ms != null ? p.fetch_ms : ms("page", "wasm_fetch_done");
          var instMs =
            p.instantiate_ms != null ? p.instantiate_ms : ms("wasm_fetch_done", "wasm_init_done");
          var startMs =
            p.startup_ms != null ? p.startup_ms : ms("wasm_init_done", "engine_ready");
          var firstMs = p.first_frame_ms != null ? p.first_frame_ms : -1;
          var hideMs =
            p.loader_hide_ms != null
              ? p.loader_hide_ms
              : m.handoff != null
                ? Math.round(m.handoff - pageAt)
                : -1;
          var line =
            "[zz boot] fetch=" +
            fetchMs +
            "ms instantiate=" +
            instMs +
            "ms startup=" +
            startMs +
            "ms first_frame=" +
            firstMs +
            "ms loader_hide=" +
            hideMs +
            "ms";
          console.log(line);
          return line;
        };
        boot.recordPhase = function (name, msVal) {
          boot.phases[name] = msVal;
        };

        // Progress while waiting for canvas / engine (status only; UI stays live).
        var canvas = document.getElementById("zz-canvas");
        var n = 0;
        var id = setInterval(function () {
          n += 1;
          if (boot.engineReady || boot.handedOff) {
            clearInterval(id);
            return;
          }
          var w = canvas ? canvas.width | 0 : 0;
          var h = canvas ? canvas.height | 0 : 0;
          if (w > 0 && h > 0) {
            setStatus("starting…");
            setProgress(70, true);
          } else if (n > 8) {
            setStatus("compiling…");
            setHint("type a callsign — engine is booting");
            setProgress(40, false);
          }
          if (n > 450) clearInterval(id);
        }, 100);

        // Resource Timing for the .wasm fetch (best-effort; may be 0 on cache).
        function noteWasmResource() {
          try {
            var entries = performance.getEntriesByType("resource");
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              if (e.name && e.name.indexOf(".wasm") >= 0) {
                boot.phases.fetch_ms = Math.round(e.duration);
                if (boot.marks.wasm_fetch_done == null) {
                  boot.marks.wasm_fetch_done = pageAt + e.responseEnd;
                }
                break;
              }
            }
          } catch (err) {}
        }
        if (typeof PerformanceObserver !== "undefined") {
          try {
            var po = new PerformanceObserver(function () {
              noteWasmResource();
            });
            po.observe({ entryTypes: ["resource"] });
          } catch (err) {}
        }
        setTimeout(noteWasmResource, 500);
        setTimeout(noteWasmResource, 2000);
      })();

      // Audio unlock for browser autoplay policy. Bevy/rodio AudioContexts
      // start suspended until a user gesture; resume any we can find, and
      // expose __zzUnlockAudio for the wasm client to call as a second path.
      (function () {
        var unlocked = false;
        function unlock() {
          if (unlocked) return;
          unlocked = true;
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              // Resume any live contexts hanging off the page / rodio.
              var contexts = window.__zzAudioContexts || [];
              for (var i = 0; i < contexts.length; i++) {
                try {
                  if (contexts[i] && contexts[i].state === "suspended") {
                    contexts[i].resume();
                  }
                } catch (e) {}
              }
              // Also poke a throwaway context in-gesture (helps some browsers).
              try {
                var c = new AC();
                if (c.state === "suspended") c.resume();
                // Keep a reference so later Bevy sinks may share the gesture unlock.
                if (!window.__zzAudioContexts) window.__zzAudioContexts = [];
                window.__zzAudioContexts.push(c);
              } catch (e) {}
            }
          } catch (e) {}
        }
        window.__zzUnlockAudio = unlock;
        ["pointerdown", "touchend", "click", "keydown"].forEach(function (evt) {
          window.addEventListener(evt, unlock, { once: true, capture: true });
        });
      })();

      // M20: capture-phase Space so jump works even if winit-web / canvas
      // focus / browser default (page scroll) / egui_text_agent steal keys.
      // Rust polls window.__zzKeys.space and ORs it into PlayerInput.jump.
      (function () {
        window.__zzKeys = { space: false };
        function isSpace(e) {
          return (
            e.code === "Space" ||
            e.key === " " ||
            e.key === "Spacebar" ||
            e.keyCode === 32
          );
        }
        function typingInOverlay() {
          var a = document.activeElement;
          if (!a) return false;
          if (a.id === "zz-name-input" || a.id === "zz-code-input") {
            var d = a.style && a.style.display;
            return d !== "none";
          }
          // Visible text fields only — never treat hidden egui_text_agent as "typing".
          if (
            (a.tagName === "INPUT" || a.tagName === "TEXTAREA") &&
            a.offsetParent !== null &&
            !a.classList.contains("egui_text_agent")
          ) {
            return true;
          }
          return false;
        }
        function onKey(e, down) {
          if (!isSpace(e)) return;
          if (typingInOverlay()) {
            // Soft-keyboard name/code: leave Space to the input.
            if (!down) window.__zzKeys.space = false;
            return;
          }
          window.__zzKeys.space = !!down;
          // Never let the page scroll or a hidden text agent eat Space in-match.
          if (e.cancelable) e.preventDefault();
        }
        window.addEventListener(
          "keydown",
          function (e) {
            onKey(e, true);
          },
          true
        );
        window.addEventListener(
          "keyup",
          function (e) {
            onKey(e, false);
          },
          true
        );
        // Blur when tab loses focus so we don't stick jump=true.
        window.addEventListener("blur", function () {
          window.__zzKeys.space = false;
        });

        // Focus hygiene: after lobby/egui clicks, put keyboard target back on
        // the game canvas and blur any leftover text agent / overlay input.
        window.__zzFocusCanvas = function () {
          try {
            var canvas = document.getElementById("zz-canvas");
            var active = document.activeElement;
            // Do not yank focus while the touch soft-keyboard overlays are up.
            if (
              active &&
              (active.id === "zz-name-input" || active.id === "zz-code-input")
            ) {
              var style = active.style && active.style.display;
              if (style !== "none") return;
            }
            if (active && active !== canvas && typeof active.blur === "function") {
              active.blur();
            }
            // bevy_egui's hidden text agent (and any other stray inputs).
            var agents = document.querySelectorAll(
              'input.egui_text_agent, textarea.egui_text_agent, input[id*="egui"]'
            );
            for (var i = 0; i < agents.length; i++) {
              try {
                agents[i].blur();
              } catch (err) {}
            }
            if (canvas && typeof canvas.focus === "function") {
              canvas.tabIndex = canvas.tabIndex >= 0 ? canvas.tabIndex : 0;
              canvas.focus({ preventScroll: true });
            }
          } catch (err) {}
        };
      })();

      // Proximity voice capture bridge (wasm client polls drainFrames).
      // Mic permission is requested ONLY via requestMic() — never at startup.
      // Worklet is inlined (zero asset files); adapted from legacy
      // voice-capture-worklet.js + Voice.ts resample/frame pipeline.
      (function () {
        var SAMPLE_RATE = 16000;
        var FRAME_MS = 120;
        var FRAME_SAMPLES = Math.round((SAMPLE_RATE * FRAME_MS) / 1000); // 1920
        var MAX_QUEUED = 8;

        // Inline AudioWorklet: batch mono float samples off the main thread.
        var WORKLET_SRC =
          "class VoiceCaptureProcessor extends AudioWorkletProcessor{" +
          "constructor(){super();this.buf=new Float32Array(2048);this.n=0;}" +
          "process(inputs){var ch=inputs[0]&&inputs[0][0];if(ch){for(var i=0;i<ch.length;i++){" +
          "this.buf[this.n++]=ch[i];if(this.n===this.buf.length){this.port.postMessage(this.buf.slice(0));this.n=0;}}}" +
          "return true;}}registerProcessor('voice-capture',VoiceCaptureProcessor);";

        var state = {
          ready: false,
          denied: false,
          txEnabled: false,
          ctx: null,
          stream: null,
          micTrack: null,
          source: null,
          capNode: null,
          silentSink: null,
          inRate: 48000,
          cursor: 0,
          prevSample: 0,
          outAccum: new Float32Array(FRAME_SAMPLES * 4),
          outLen: 0,
          frames: [],
        };

        function ensureContext() {
          if (state.ctx) {
            if (state.ctx.state === "suspended") state.ctx.resume();
            return state.ctx;
          }
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          state.ctx = new AC();
          state.inRate = state.ctx.sampleRate || 48000;
          state.silentSink = state.ctx.createGain();
          state.silentSink.gain.value = 0;
          state.silentSink.connect(state.ctx.destination);
          if (!window.__zzAudioContexts) window.__zzAudioContexts = [];
          window.__zzAudioContexts.push(state.ctx);
          if (state.ctx.state === "suspended") state.ctx.resume();
          return state.ctx;
        }

        function resample(input) {
          var len = input.length;
          if (len === 0) return input;
          if (state.inRate === SAMPLE_RATE) {
            state.prevSample = input[len - 1];
            return input;
          }
          var ratio = state.inRate / SAMPLE_RATE;
          var out = [];
          var pos = state.cursor;
          while (pos < len) {
            var i = Math.floor(pos);
            var frac = pos - i;
            var a = i < 0 ? state.prevSample : input[i];
            var j = i + 1;
            var b = j < 0 ? state.prevSample : j < len ? input[j] : input[len - 1];
            out.push(a + (b - a) * frac);
            pos += ratio;
          }
          state.cursor = pos - len;
          state.prevSample = input[len - 1];
          return Float32Array.from(out);
        }

        function append(s) {
          var need = state.outLen + s.length;
          if (need > state.outAccum.length) {
            var grow = new Float32Array(Math.max(need, state.outAccum.length * 2));
            grow.set(state.outAccum.subarray(0, state.outLen));
            state.outAccum = grow;
          }
          state.outAccum.set(s, state.outLen);
          state.outLen += s.length;
        }

        function onCaptureChunk(input) {
          if (!state.txEnabled) {
            state.outLen = 0;
            return;
          }
          var res = resample(input);
          append(res);
          while (state.outLen >= FRAME_SAMPLES) {
            var pcm = new Int16Array(FRAME_SAMPLES);
            for (var i = 0; i < FRAME_SAMPLES; i++) {
              var s = Math.max(-1, Math.min(1, state.outAccum[i]));
              pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            // Store as Uint8Array (LE view of the Int16 buffer) for Rust.
            var u8 = new Uint8Array(pcm.buffer.slice(0));
            state.frames.push(u8);
            while (state.frames.length > MAX_QUEUED) state.frames.shift();
            state.outAccum.copyWithin(0, FRAME_SAMPLES, state.outLen);
            state.outLen -= FRAME_SAMPLES;
          }
        }

        async function buildCapture() {
          if (!state.ctx || !state.stream || state.capNode) return;
          state.source = state.ctx.createMediaStreamSource(state.stream);
          if (state.ctx.audioWorklet) {
            try {
              var blob = new Blob([WORKLET_SRC], { type: "application/javascript" });
              var url = URL.createObjectURL(blob);
              await state.ctx.audioWorklet.addModule(url);
              URL.revokeObjectURL(url);
              var node = new AudioWorkletNode(state.ctx, "voice-capture");
              node.port.onmessage = function (e) {
                onCaptureChunk(e.data);
              };
              state.source.connect(node);
              node.connect(state.silentSink);
              state.capNode = node;
              return;
            } catch (e) {
              /* fall through */
            }
          }
          // ScriptProcessor fallback (deprecated, widely available).
          var sp = state.ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = function (e) {
            onCaptureChunk(e.inputBuffer.getChannelData(0));
          };
          state.source.connect(sp);
          sp.connect(state.silentSink);
          state.capNode = sp;
        }

        async function requestMic() {
          if (state.ready || state.denied) return state.ready;
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              state.denied = true;
              return false;
            }
            ensureContext();
            if (!state.ctx) {
              state.denied = true;
              return false;
            }
            var stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
              },
              video: false,
            });
            state.stream = stream;
            state.micTrack = stream.getAudioTracks()[0] || null;
            if (state.micTrack) state.micTrack.enabled = !!state.txEnabled;
            await buildCapture();
            state.ready = true;
            return true;
          } catch (e) {
            state.denied = true;
            state.ready = false;
            return false;
          }
        }

        function setTxEnabled(on) {
          state.txEnabled = !!on;
          if (state.micTrack) state.micTrack.enabled = state.txEnabled;
          if (!state.txEnabled) {
            state.outLen = 0;
            state.frames = [];
          }
        }

        function drainFrames() {
          var out = state.frames;
          state.frames = [];
          return out;
        }

        window.__zzVoice = {
          get ready() {
            return state.ready;
          },
          get denied() {
            return state.denied;
          },
          requestMic: requestMic,
          setTxEnabled: setTxEnabled,
          drainFrames: drainFrames,
        };
      })();
    </script>
  </body>
