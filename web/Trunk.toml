# Trunk web shell for zz-client (wasm32 + WebGL2).
#
# From this directory:
#   trunk serve          # dev server with auto-rebuild
#   trunk build          # debug wasm → web/dist/
#
# CI / shipping (workspace [profile.wasm-release] + wasm-opt -Oz):
#   trunk build --release
# Equivalent CLI if you override config:
#   trunk build --release --cargo-profile wasm-release
#
# Requires: rustup target add wasm32-unknown-unknown
#           cargo install trunk --locked
#           binaryen (wasm-opt) for data-wasm-opt on the rust link tag

[build]
target = "index.html"
dist = "dist"
public_url = "/"
# Used when `trunk build --release` (or TRUNK_BUILD_RELEASE=true).
# Maps to `cargo build --profile wasm-release`.
cargo_profile = "wasm-release"

[watch]
watch = ["../crates/zz-client", "."]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
